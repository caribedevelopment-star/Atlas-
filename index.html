<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#050403" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Al.Kim.ia</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.179.1/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <main id="experience">
    <canvas id="world" aria-label="Al.Kim.ia interactive experience"></canvas>
    <div class="grain"></div>
    <div class="vignette"></div>
    <div id="transitionVeil" class="transition-veil"></div>

    <section id="intro" class="screen">
      <div class="screen-inner">
        <div class="kicker">AN INTERACTIVE MEMORY</div>
        <h1>AL.KIM.IA</h1>
        <div class="memory-label">MEMORY 01 · THE ENCOUNTER</div>
        <p>Una historia contada como materia, espacio, música y memoria.</p>
        <button id="enter">ENTER</button>
      </div>
    </section>

    <div id="chapter" class="chapter hidden">
      <span id="chapterIndex">MEMORY 01</span>
      <strong id="chapterTitle">THE ENCOUNTER</strong>
    </div>

    <div id="hud" class="hud hidden">
      <div class="brand">AL.KIM.IA</div>
      <div class="proximity"><span id="proximityBar"></span></div>
      <div id="hint" class="hint">WASD · MOVER &nbsp; / &nbsp; ARRASTRA · MIRAR</div>
    </div>

    <div id="joystick" class="joystick hidden" aria-hidden="true">
      <div class="joystick-ring"></div>
      <div class="joystick-knob"></div>
    </div>

    <div id="fallback" class="fallback hidden">Esta memoria necesita WebGL para abrirse.</div>
  </main>

  <script type="module" src="/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  </script>
</body>
</html>
